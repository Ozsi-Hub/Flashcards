<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okos Szószedet Tanuló App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col items-center justify-start p-4 selection:bg-indigo-500 selection:text-white">

  <div class="max-w-md w-full bg-slate-900/90 backdrop-blur-md rounded-2xl p-5 shadow-2xl border border-slate-800/80 mt-2">
    
    <!-- Google Sheet CSV URL Beállítás -->
    <div class="mb-3">
      <h1 class="text-base font-bold text-center mb-1 text-indigo-400 tracking-wide">🧠 Okos Szótanuló App</h1>
      <p class="text-[11px] text-slate-400 text-center mb-2">1. oszlop: Angol | 2. oszlop: Magyar</p>
      <input type="text" id="csvUrl" placeholder="Illeszd be a Google Sheet CSV URL-t" 
             class="w-full text-xs p-2.5 rounded-xl bg-slate-800/80 text-slate-200 border border-slate-700/80 focus:outline-none focus:border-indigo-500 transition">
      <button onclick="loadWords()" class="mt-2 w-full bg-indigo-600 hover:bg-indigo-500 text-xs py-2.5 rounded-xl font-semibold shadow-lg shadow-indigo-600/20 transition">Szavak betöltése</button>
    </div>

    <!-- Különálló Tól - Ig Tartományválasztó -->
    <div id="rangeSelectorContainer" class="hidden mb-3 bg-slate-950/60 p-2.5 rounded-xl border border-slate-800">
      <div class="flex justify-between items-center mb-1.5">
        <span class="text-[11px] text-slate-400 font-medium">Egyedi szó tartomány:</span>
        <span id="totalWordsInfo" class="text-[10px] text-indigo-400 font-semibold">Összesen: 0 szó</span>
      </div>
      <div class="grid grid-cols-2 gap-2 mb-2">
        <div>
          <label for="rangeFrom" class="block text-[10px] text-slate-400 mb-0.5">Tól (szó sorszáma):</label>
          <input type="number" id="rangeFrom" min="1" placeholder="Pl. 1000" 
                 class="w-full text-xs p-2 rounded-lg bg-slate-800/80 text-slate-200 border border-slate-700/80 focus:outline-none focus:border-indigo-500 transition">
        </div>
        <div>
          <label for="rangeTo" class="block text-[10px] text-slate-400 mb-0.5">Ig (szó sorszáma):</label>
          <input type="number" id="rangeTo" min="1" placeholder="Pl. 2000" 
                 class="w-full text-xs p-2 rounded-lg bg-slate-800/80 text-slate-200 border border-slate-700/80 focus:outline-none focus:border-indigo-500 transition">
        </div>
      </div>
      <button onclick="applyWordRange()" class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs py-1.5 rounded-lg border border-slate-700/80 transition font-medium">Tartomány alkalmazása</button>
    </div>

    <!-- Hiba/Státusz üzenet kijelző -->
    <div id="statusMsg" class="text-xs text-center mb-2 text-amber-400 font-medium"></div>

    <!-- Tanulási Mód Választó (Normál vs Okos) -->
    <div class="flex bg-slate-950/80 p-1 rounded-xl mb-3 border border-slate-800">
      <button id="modeNormal" onclick="setStudyMode('normal')" class="flex-1 py-1.5 text-[11px] font-medium rounded-lg bg-indigo-600 text-white transition shadow-sm">Hagyományos (Sorban)</button>
      <button id="modeSmart" onclick="setStudyMode('smart')" class="flex-1 py-1.5 text-[11px] font-medium rounded-lg text-slate-400 hover:text-white transition">🎯 Okos Ismétlés (Újak elöl)</button>
    </div>

    <!-- 4 Lapfül Ikonokkal -->
    <div class="grid grid-cols-4 gap-1 bg-slate-950/80 p-1 rounded-xl mb-4 border border-slate-800">
      <button onclick="switchTab(0)" id="tabBtn0" class="py-2 text-xs font-medium rounded-lg bg-indigo-600 text-white transition flex flex-col items-center shadow-sm">
        <span>🃏</span><span class="text-[10px] mt-0.5">Kártya</span>
      </button>
      <button onclick="switchTab(1)" id="tabBtn1" class="py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition flex flex-col items-center">
        <span>🎤</span><span class="text-[10px] mt-0.5">Kiejtés</span>
      </button>
      <button onclick="switchTab(2)" id="tabBtn2" class="py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition flex flex-col items-center">
        <span>🧩</span><span class="text-[10px] mt-0.5">Párosító</span>
      </button>
      <button onclick="switchTab(3)" id="tabBtn3" class="py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition flex flex-col items-center">
        <span>🧠</span><span class="text-[10px] mt-0.5">Kvíz</span>
      </button>
    </div>

    <!-- ================= 1. FÜL: FLASHCARD ================= -->
    <div id="tabContent0" class="tab-content">
      <div id="card" onclick="flipCard()" class="h-36 bg-slate-800/80 border border-slate-700/60 rounded-xl flex flex-col items-center justify-center p-4 cursor-pointer hover:bg-slate-800 transition shadow-inner">
        <span id="cardLabel" class="text-xs text-indigo-400 mb-1 uppercase tracking-wider font-medium">Angol szó:</span>
        <span id="cardText" class="text-2xl font-bold text-center text-slate-100">Töltsd be a szavakat</span>
        <span id="cardHint" class="text-xs text-slate-400 mt-2">(Kattints a fordításhoz)</span>
      </div>
      
      <div id="cardRatingBox" class="hidden grid grid-cols-2 gap-2 mt-3">
        <button onclick="rateWord(false)" class="bg-rose-950/40 hover:bg-rose-900/50 text-rose-300 border border-rose-800/60 py-2 rounded-xl text-xs font-medium transition">❌ Nem tudtam</button>
        <button onclick="rateWord(true)" class="bg-emerald-950/40 hover:bg-emerald-900/50 text-emerald-300 border border-emerald-800/60 py-2 rounded-xl text-xs font-medium transition">✓ Tudtam</button>
      </div>

      <div class="flex justify-between items-center mt-3">
        <button onclick="prevCard()" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-xs font-medium border border-slate-700/60 transition">⬅ Előző</button>
        <span id="cardCounter" class="text-xs text-slate-400 font-medium">0 / 0</span>
        <button onclick="nextCard()" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-4 py-2 rounded-xl text-xs font-medium border border-slate-700/60 transition">Következő ➡</button>
      </div>
    </div>

    <!-- ================= 2. FÜL: KIEJTÉS (MIKROFONOS) ================= -->
    <div id="tabContent1" class="tab-content hidden">
      <div class="h-36 bg-slate-800/80 border border-slate-700/60 rounded-xl flex flex-col items-center justify-center p-4 shadow-inner">
        <span class="text-xs text-violet-400 mb-1 uppercase tracking-wider font-medium">Mondd ki angolul:</span>
        <span id="voiceTargetHu" class="text-2xl font-bold text-center text-slate-100">...</span>
        <span id="voiceHint" class="text-xs text-slate-400 mt-2">Nyomd meg a mikrofont!</span>
      </div>
      <div id="voiceFeedback" class="h-8 mt-2 text-xs font-semibold flex items-center justify-center px-1 text-center"></div>
      <div class="flex justify-center items-center gap-4 mt-2">
        <button onclick="startListening()" class="bg-violet-600 hover:bg-violet-500 text-white p-4 rounded-full shadow-lg shadow-violet-600/30 transition flex items-center justify-center scale-110">
          🎤
        </button>
        <button onclick="nextVoiceCard()" class="bg-slate-800/80 hover:bg-slate-700 text-slate-300 px-5 py-2.5 rounded-xl text-xs font-medium border border-slate-700/60 transition">Következő ➔</button>
      </div>
    </div>

    <!-- ================= 3. FÜL: PÁROSÍTÓ JÁTÉK ================= -->
    <div id="tabContent2" class="tab-content hidden">
      <div class="text-xs text-slate-400 text-center mb-2">Kattints egy rejtett angol szóra, majd a magyar párjára!</div>
      <div class="grid grid-cols-2 gap-3 min-h-[180px]" id="matchContainer"></div>
      <button onclick="initMatchGame()" class="mt-3 w-full bg-slate-800/80 hover:bg-slate-700 text-slate-300 border border-slate-700/60 text-xs py-2.5 rounded-xl transition font-medium">🔄 Új 4-es csomag</button>
    </div>

    <!-- ================= 4. FÜL: KVÍZ ================= -->
    <div id="tabContent3" class="tab-content hidden">
      <div class="h-28 bg-slate-800/80 border border-slate-700/60 rounded-xl flex flex-col items-center justify-center p-3 shadow-inner">
        <span class="text-xs text-emerald-400 mb-1 font-medium">Mit jelent ez angolul?</span>
        <span id="quizQuestion" class="text-xl font-bold text-center text-slate-100">...</span>
      </div>
      <div id="quizOptions" class="grid grid-cols-2 gap-2 mt-3"></div>
    </div>

  </div>

  <script>
    let allWords = [];     
    let activeWords = [];  
    let currentIndex = 0;
    let isFlipped = false;
    let studyMode = 'normal';
    let isQuizAnswering = false;
    let currentQuizWord = null; // Aktív kvíz szó referenciája

    function setStatus(text, colorClass = "text-amber-400") {
      const el = document.getElementById('statusMsg');
      if (el) {
        el.className = `text-xs text-center mb-2 font-medium ${colorClass}`;
        el.innerText = text;
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = false;

      recognition.onstart = () => {
        const fb = document.getElementById('voiceFeedback');
        if (fb) {
          fb.className = "h-8 mt-2 text-xs font-semibold flex items-center justify-center text-amber-400";
          fb.innerText = "Hallgatlak... Beszélj!";
        }
      };

      recognition.onresult = (event) => {
        const spokenText = event.results[0][0].transcript.toLowerCase().trim();
        const targetWord = activeWords[currentIndex]?.en.toLowerCase().trim();
        const fb = document.getElementById('voiceFeedback');

        if (spokenText === targetWord) {
          if (fb) {
            fb.className = "h-8 mt-2 text-xs font-semibold flex items-center justify-center text-emerald-400";
            fb.innerText = `✓ Helyes! ("${spokenText}")`;
          }
          activeWords[currentIndex].weight = Math.max(1, activeWords[currentIndex].weight - 1);
          saveWeightsToLocalStorage();

          setTimeout(() => { nextVoiceCard(); }, 1500);
        } else {
          if (fb) {
            fb.className = "h-8 mt-2 text-xs font-semibold flex items-center justify-center text-rose-400";
            fb.innerHTML = `✗ Hallott: "${spokenText}". Helyes: <b>${activeWords[currentIndex].en}</b>`;
          }
          activeWords[currentIndex].weight += 2;
          saveWeightsToLocalStorage();
        }
      };

      recognition.onerror = () => {
        const fb = document.getElementById('voiceFeedback');
        if (fb) fb.innerText = "Nem hallottam tisztán, próbáld újra.";
      };
    }

    function setStudyMode(mode) {
      studyMode = mode;
      const btnNormal = document.getElementById('modeNormal');
      const btnSmart = document.getElementById('modeSmart');
      const ratingBox = document.getElementById('cardRatingBox');

      if (mode === 'normal') {
        btnNormal.className = "flex-1 py-1.5 text-[11px] font-medium rounded-lg bg-indigo-600 text-white transition shadow-sm";
        btnSmart.className = "flex-1 py-1.5 text-[11px] font-medium rounded-lg text-slate-400 hover:text-white transition";
        ratingBox.classList.add('hidden');
      } else {
        btnSmart.className = "flex-1 py-1.5 text-[11px] font-medium rounded-lg bg-emerald-600 text-white transition shadow-sm";
        btnNormal.className = "flex-1 py-1.5 text-[11px] font-medium rounded-lg text-slate-400 hover:text-white transition";
        ratingBox.classList.remove('hidden');
      }
      currentIndex = studyMode === 'smart' ? getNextSmartIndex() : 0;
      showCard();
    }

    function getNextSmartIndex() {
      if (activeWords.length === 0) return 0;
      if (studyMode === 'normal') {
        return (currentIndex + 1) % activeWords.length;
      }

      let totalWeight = 0;
      let weights = activeWords.map((w, idx) => {
        let posFactor = (idx + 1) / activeWords.length;
        let wVal = w.weight * (1 + posFactor * 3);
        totalWeight += wVal;
        return wVal;
      });
      
      let randomVal = Math.random() * totalWeight;
      let currentSum = 0;
      for (let i = 0; i < activeWords.length; i++) {
        currentSum += weights[i];
        if (randomVal <= currentSum) return i;
      }
      return activeWords.length - 1;
    }

    function saveWeightsToLocalStorage() {
      let weightsData = allWords.map(w => ({ en: w.en, weight: w.weight }));
      localStorage.setItem('vocabWeights', JSON.stringify(weightsData));
    }

    function loadWeightsFromLocalStorage() {
      let saved = localStorage.getItem('vocabWeights');
      if (!saved) return;
      let weightsData = JSON.parse(saved);
      allWords.forEach(w => {
        let found = weightsData.find(s => s.en === w.en);
        if (found) w.weight = found.weight;
      });
    }

    function switchTab(index) {
      for (let i = 0; i < 4; i++) {
        document.getElementById(`tabContent${i}`).classList.add('hidden');
        document.getElementById(`tabBtn${i}`).className = "py-2 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition flex flex-col items-center";
      }
      document.getElementById(`tabContent${index}`).classList.remove('hidden');
      
      const activeColors = ['bg-indigo-600 text-white shadow-sm', 'bg-violet-600 text-white shadow-sm', 'bg-amber-600 text-white shadow-sm', 'bg-emerald-600 text-white shadow-sm'];
      document.getElementById(`tabBtn${index}`).className = `py-2 text-xs font-medium rounded-lg ${activeColors[index]} transition flex flex-col items-center`;

      if (index === 2 && activeWords.length > 0) initMatchGame();
      if (index === 3 && activeWords.length > 0) initQuiz();
    }

    async function loadWords() {
      const inputUrl = document.getElementById('csvUrl').value.trim();
      if (!inputUrl) {
        alert("Kérlek adj meg egy valid CSV URL-t!");
        return;
      }

      let csvUrl = inputUrl;
      if (csvUrl.includes('/edit')) {
        csvUrl = csvUrl.replace(/\/edit.*$/, '/export?format=csv');
      }

      setStatus("Betöltés folyamatban...");

      try {
        const response = await fetch(csvUrl);
        if (!response.ok) throw new Error("Hálózati hiba: " + response.status);
        
        const data = await response.text();
        if (data.trim().startsWith('<!DOCTYPE html>')) {
          setStatus("Hiba: A Google Sheet nem nyilvános! (Közzététel szükséges)", "text-rose-400");
          alert("Hiba: A Google Sheet nem nyilvános! Ellenőrizd a webes közzétételt.");
          return;
        }

        const rows = data.split('\n');
        let validWords = [];
        let i = 0;
        let safetyCounter = 0;

        while (i < rows.length && safetyCounter < 10000) {
          safetyCounter++;
          const currentRow = rows[i++];
          if (!currentRow || currentRow.trim() === '') continue;

          const cols = currentRow.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
          const en = cols[0]?.replace(/"/g, '').trim();
          const hu = cols[1]?.replace(/"/g, '').trim();

          if (en && hu) validWords.push({ en, hu, weight: 3 });
        }

        allWords = validWords;
        if (allWords.length === 0) {
          setStatus("Nem találtunk szavakat a megadott helyen.", "text-rose-400");
          alert("Nem találtunk szavakat a megadott helyen.");
          return;
        }

        loadWeightsFromLocalStorage();

        document.getElementById('rangeFrom').value = 1;
        document.getElementById('rangeTo').value = allWords.length;
        document.getElementById('totalWordsInfo').innerText = `Összesen: ${allWords.length} szó`;
        document.getElementById('rangeSelectorContainer').classList.remove('hidden');

        applyWordRange();

        setStatus(`Sikeresen betöltve: ${allWords.length} szó!`, "text-emerald-400");
      } catch (err) {
        console.error(err);
        setStatus("Hiba a betöltés során. Nézd meg a konzolt!", "text-rose-400");
        alert("Nem sikerült betölteni a CSV-t. Ellenőrizd a linket!");
      }
    }

    function applyWordRange() {
      if (allWords.length === 0) return;

      let fromVal = parseInt(document.getElementById('rangeFrom').value);
      let toVal = parseInt(document.getElementById('rangeTo').value);

      if (isNaN(fromVal) || fromVal < 1) fromVal = 1;
      if (isNaN(toVal) || toVal > allWords.length) toVal = allWords.length;
      if (fromVal > toVal) {
        alert("A 'Tól' érték nem lehet nagyobb, mint az 'Ig' érték!");
        return;
      }

      activeWords = allWords.slice(fromVal - 1, toVal);

      if (activeWords.length === 0) {
        alert("A megadott tartományban nincsenek szavak!");
        return;
      }

      currentIndex = studyMode === 'smart' ? activeWords.length - 1 : 0;
      showCard();
      showVoiceCard();

      // Frissítjük a füleket a tartomány alapján
      let activeTabId = document.querySelector('.tab-content:not(.hidden)').id;
      if (activeTabId === 'tabContent2') {
        initMatchGame();
      } else if (activeTabId === 'tabContent3') {
        initQuiz();
      }
    }

    function showCard() {
      if (activeWords.length === 0) return;
      isFlipped = false;
      document.getElementById('cardLabel').innerText = studyMode === 'smart' ? `Angol szó (Súly: ${activeWords[currentIndex].weight}):` : "Angol szó:";
      document.getElementById('cardText').innerText = activeWords[currentIndex].en;
      document.getElementById('cardHint').innerText = "(Kattints a fordításhoz)";
      document.getElementById('cardCounter').innerText = `${currentIndex + 1} / ${activeWords.length}`;
    }

    function flipCard() {
      if (activeWords.length === 0) return;
      isFlipped = !isFlipped;
      document.getElementById('cardLabel').innerText = isFlipped ? "Magyar jelentés:" : "Angol szó:";
      document.getElementById('cardText').innerText = isFlipped ? activeWords[currentIndex].hu : activeWords[currentIndex].en;
      document.getElementById('cardHint').innerText = isFlipped ? "(Kattints az angolhoz)" : "(Kattints a fordításhoz)";
    }

    function nextCard() {
      if (activeWords.length === 0) return;
      currentIndex = getNextSmartIndex();
      showCard();
    }

    function prevCard() {
      if (activeWords.length === 0) return;
      currentIndex = (currentIndex - 1 + activeWords.length) % activeWords.length;
      showCard();
    }

    function rateWord(known) {
      if (activeWords.length === 0) return;
      if (known) {
        activeWords[currentIndex].weight = Math.max(1, activeWords[currentIndex].weight - 1);
      } else {
        activeWords[currentIndex].weight += 3;
      }
      saveWeightsToLocalStorage();
      nextCard();
    }

    function showVoiceCard() {
      if (activeWords.length === 0) return;
      document.getElementById('voiceTargetHu').innerText = activeWords[currentIndex].hu;
      document.getElementById('voiceFeedback').innerText = "";
    }

    function nextVoiceCard() {
      if (activeWords.length === 0) return;
      currentIndex = getNextSmartIndex();
      showVoiceCard();
    }

    function startListening() {
      if (activeWords.length === 0) return alert("Először töltsd be a szavakat!");
      if (recognition) {
        try { recognition.start(); } 
        catch (e) { recognition.stop(); setTimeout(() => recognition.start(), 200); }
      } else {
        alert("A böngésződ nem támogatja a beépített beszédfelismerést.");
      }
    }

    function isPhrase(item) {
      return item.en.includes(' ') || item.en.length > 12;
    }

    // ================= 3. FÜL: PÁROSÍTÓ JÁTÉK =================
    let matchEnList = [];
    let matchHuList = [];
    let selectedEnItem = null;
    let selectedHuItem = null;
    let matchPairsLeft = 4;
    let wrongHuText = null;

    function initMatchGame() {
      if (activeWords.length < 4) {
        const container = document.getElementById('matchContainer');
        if(container) container.innerHTML = '<div class="text-xs text-rose-400 text-center col-span-2">A kiválasztott tartományban nincs elég (min. 4) szó a párosítóhoz!</div>';
        return;
      }
      
      let simpleWords = activeWords.filter(w => !isPhrase(w));
      let phraseWords = activeWords.filter(w => isPhrase(w));

      let selected4 = [];
      if (simpleWords.length >= 4 && (phraseWords.length < 4 || Math.random() > 0.5)) {
        simpleWords.sort(() => 0.5 - Math.random());
        selected4 = simpleWords.slice(0, 4);
      } else if (phraseWords.length >= 4) {
        phraseWords.sort(() => 0.5 - Math.random());
        selected4 = phraseWords.slice(0, 4);
      } else {
        let pool = [...activeWords].sort(() => 0.5 - Math.random());
        selected4 = pool.slice(0, 4);
      }

      matchEnList = selected4.map(item => ({ en: item.en, hu: item.hu, matched: false }));
      matchHuList = selected4.map(item => ({ en: item.en, hu: item.hu, matched: false }));
      
      matchEnList.sort(() => 0.5 - Math.random());
      matchHuList.sort(() => 0.5 - Math.random());

      selectedEnItem = null;
      selectedHuItem = null;
      wrongHuText = null;
      matchPairsLeft = 4;

      renderMatchBoard();
    }

    function renderMatchBoard() {
      const container = document.getElementById('matchContainer');
      if (!container) return;
      container.innerHTML = '';

      let html = '<div class="flex flex-col gap-2">';
      matchEnList.forEach((item, idx) => {
        let bgClass = item.matched 
          ? 'bg-emerald-950/60 border-emerald-600/80 text-emerald-300' 
          : (selectedEnItem === item ? 'bg-indigo-600 border-indigo-400 text-white' : 'bg-slate-800/80 border-slate-700/60 hover:bg-slate-800 text-slate-200');
        
        let content = item.matched 
          ? `<span class="text-emerald-300 font-bold">${item.en}</span>` 
          : `🔒 <i>(Kattints a hangért)</i>`;

        html += `<div onclick="selectEnIndex(${idx})" class="p-2.5 rounded-xl border text-xs font-semibold cursor-pointer text-center flex items-center justify-center h-12 transition shadow-sm ${bgClass}">
                  ${content}
                 </div>`;
      });
      html += '</div><div class="flex flex-col gap-2">';

      matchHuList.forEach((item, idx) => {
        let bgClass = 'bg-slate-800/80 border-slate-700/60 hover:bg-slate-800 text-slate-200';
        if (item.matched) {
          bgClass = 'bg-emerald-950/60 border-emerald-600/80 text-emerald-300';
        } else if (wrongHuText === item.hu) {
          bgClass = 'bg-rose-950/80 border-rose-500 text-rose-200 animate-pulse';
        } else if (selectedHuItem === item) {
          bgClass = 'bg-amber-600 border-amber-400 text-white';
        }

        html += `<div onclick="selectHuIndex(${idx})" class="p-2.5 rounded-xl border text-xs font-semibold cursor-pointer text-center flex items-center justify-center h-12 transition shadow-sm ${bgClass}">
                  ${item.hu}
                 </div>`;
      });
      html += '</div>';

      container.innerHTML = html;
    }

    function selectEnIndex(idx) {
      let item = matchEnList[idx];
      if (item.matched) return;
      speakWord(item.en); 
      selectedEnItem = item;
      checkMatchLogic();
      renderMatchBoard();
    }

    function selectHuIndex(idx) {
      let item = matchHuList[idx];
      if (item.matched) return;
      selectedHuItem = item;
      checkMatchLogic();
      renderMatchBoard();
    }

    function speakWord(text) {
      if ('speechSynthesis' in window) {
        let utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        window.speechSynthesis.speak(utterance);
      }
    }

    function checkMatchLogic() {
      if (selectedEnItem !== null && selectedHuItem !== null) {
        if (selectedEnItem.hu === selectedHuItem.hu) {
          selectedEnItem.matched = true;
          selectedHuItem.matched = true;
          matchPairsLeft--;

          let originalWord = activeWords.find(w => w.en === selectedEnItem.en);
          if (originalWord) {
            originalWord.weight = Math.max(1, originalWord.weight - 1);
            saveWeightsToLocalStorage();
          }

          selectedEnItem = null;
          selectedHuItem = null;

          if (matchPairsLeft === 0) {
            setTimeout(() => {
              initMatchGame();
            }, 600);
          }
        } else {
          wrongHuText = selectedHuItem.hu;
          
          let originalWord = activeWords.find(w => w.en === selectedEnItem.en);
          if (originalWord) {
            originalWord.weight += 2;
            saveWeightsToLocalStorage();
          }

          renderMatchBoard();

          setTimeout(() => {
            wrongHuText = null;
            selectedEnItem = null;
            selectedHuItem = null;
            renderMatchBoard();
          }, 2000);
          return;
        }
      }
    }

    // ================= 4. FÜL: KVÍZ (Javítva az aktív tartományra) =================
    function initQuiz() {
      if (activeWords.length < 4) {
        const qEl = document.getElementById('quizQuestion');
        const optContainer = document.getElementById('quizOptions');
        if(qEl) qEl.innerText = "Nincs elég szó!";
        if(optContainer) optContainer.innerHTML = '<div class="text-xs text-rose-400 text-center col-span-2">Legalább 4 szó szükséges a tartományban a kvízhez!</div>';
        return;
      }
      isQuizAnswering = false;
      
      // Biztosan az activeWords listából sorsolunk indexet
      let quizIdx = getNextSmartIndex();
      currentQuizWord = activeWords[quizIdx];

      document.getElementById('quizQuestion').innerText = currentQuizWord.hu;

      let targetIsPhrase = isPhrase(currentQuizWord);
      let sameTypeWords = activeWords.filter(w => w !== currentQuizWord && isPhrase(w) === targetIsPhrase);
      
      if (sameTypeWords.length < 3) {
        sameTypeWords = activeWords.filter(w => w !== currentQuizWord);
      }
      sameTypeWords.sort(() => 0.5 - Math.random());

      let options = [currentQuizWord.en, ...sameTypeWords.slice(0, 3).map(w => w.en)];
      options.sort(() => 0.5 - Math.random());

      let optContainer = document.getElementById('quizOptions');
      optContainer.innerHTML = '';
      options.forEach(opt => {
        let btn = document.createElement('button');
        btn.className = "p-3 bg-slate-800/80 hover:bg-slate-700/80 rounded-xl text-xs font-semibold transition border border-slate-700/60 text-slate-200 shadow-sm";
        btn.innerText = opt;
        btn.addEventListener('click', () => checkQuiz(btn, opt, currentQuizWord.en));
        optContainer.appendChild(btn);
      });
    }

    function checkQuiz(btnElement, selected, correct) {
      if (isQuizAnswering || !currentQuizWord) return;
      isQuizAnswering = true;

      const baseClasses = "p-3 rounded-xl text-xs font-semibold transition border shadow-sm";

      if (selected === correct) {
        currentQuizWord.weight = Math.max(1, currentQuizWord.weight - 1);
        saveWeightsToLocalStorage();

        btnElement.className = `${baseClasses} bg-emerald-950/80 text-emerald-200 border-emerald-500 ring-2 ring-emerald-500/40`;

        setTimeout(() => {
          initQuiz();
        }, 3000);
      } else {
        currentQuizWord.weight += 2;
        saveWeightsToLocalStorage();

        btnElement.className = `${baseClasses} bg-rose-950/80 text-rose-200 border-rose-500 ring-2 ring-rose-500/40`;

        setTimeout(() => {
          btnElement.className = `${baseClasses} bg-slate-800/80 hover:bg-slate-700/80 text-slate-200 border-slate-700/60`;
          isQuizAnswering = false;
        }, 2000);
      }
    }
  </script>
