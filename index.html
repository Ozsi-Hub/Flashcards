<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Okos Szószedet Tanuló App</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-start p-4">

  <div class="max-w-md w-full bg-slate-800 rounded-2xl p-5 shadow-xl border border-slate-700 mt-2">
    
    <!-- Google Sheet CSV URL Beállítás -->
    <div class="mb-3">
      <h1 class="text-base font-bold text-center mb-1 text-blue-400">🧠 Okos Szótanuló App</h1>
      <p class="text-[11px] text-slate-400 text-center mb-2">1. oszlop: Angol | 2. oszlop: Magyar</p>
      <input type="text" id="csvUrl" placeholder="Illeszd be a Google Sheet CSV URL-t" 
             class="w-full text-xs p-2 rounded bg-slate-700 text-slate-200 border border-slate-600 focus:outline-none focus:border-blue-500">
      <button id="loadBtn" class="mt-2 w-full bg-blue-600 hover:bg-blue-500 text-xs py-2 rounded font-bold transition">Szavak betöltése</button>
    </div>

    <!-- Tanulási Mód Választó (Normál vs Okos) -->
    <div class="flex bg-slate-900 p-1 rounded-xl mb-3 border border-slate-700">
      <button id="modeNormal" class="flex-1 py-1.5 text-[11px] font-semibold rounded-lg bg-blue-600 text-white transition">Hagyományos (Összes)</button>
      <button id="modeSmart" class="flex-1 py-1.5 text-[11px] font-semibold rounded-lg text-slate-400 hover:text-white transition">🎯 Okos Ismétlés</button>
    </div>

    <!-- 4 Lapfül Ikonokkal -->
    <div class="grid grid-cols-4 gap-1 bg-slate-900 p-1 rounded-xl mb-4 border border-slate-700">
      <button id="tabBtn0" class="py-2 text-xs font-semibold rounded-lg bg-blue-600 text-white transition flex flex-col items-center">
        <span>🃏</span><span class="text-[10px]">Kártya</span>
      </button>
      <button id="tabBtn1" class="py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition flex flex-col items-center">
        <span>🎤</span><span class="text-[10px]">Kiejtés</span>
      </button>
      <button id="tabBtn2" class="py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition flex flex-col items-center">
        <span>🧩</span><span class="text-[10px]">Párosító</span>
      </button>
      <button id="tabBtn3" class="py-2 text-xs font-semibold rounded-lg text-slate-400 hover:text-white transition flex flex-col items-center">
        <span>🧠</span><span class="text-[10px]">Kvíz</span>
      </button>
    </div>

    <!-- ================= 1. FÜL: FLASHCARD ================= -->
    <div id="tabContent0" class="tab-content">
      <div id="card" class="h-36 bg-slate-700 rounded-xl flex flex-col items-center justify-center p-4 cursor-pointer hover:bg-slate-650 transition shadow-inner">
        <span id="cardLabel" class="text-xs text-blue-400 mb-1 uppercase tracking-wider">Angol szó:</span>
        <span id="cardText" class="text-2xl font-bold text-center">Töltsd be a szavakat</span>
        <span id="cardHint" class="text-xs text-slate-400 mt-2">(Kattints a fordításhoz)</span>
      </div>
      
      <div id="cardRatingBox" class="hidden grid grid-cols-2 gap-2 mt-3">
        <button id="btnNotKnown" class="bg-red-900/60 hover:bg-red-800 text-red-200 border border-red-700 py-1.5 rounded-lg text-xs font-semibold transition">❌ Nem tudtam</button>
        <button id="btnKnown" class="bg-emerald-900/60 hover:bg-emerald-800 text-emerald-200 border border-emerald-700 py-1.5 rounded-lg text-xs font-semibold transition">✓ Tudtam</button>
      </div>

      <div class="flex justify-between items-center mt-3">
        <button id="prevCardBtn" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-medium transition">⬅ Előző</button>
        <span id="cardCounter" class="text-xs text-slate-400">0 / 0</span>
        <button id="nextCardBtn" class="bg-slate-700 hover:bg-slate-600 px-4 py-2 rounded-xl text-xs font-medium transition">Következő ➡</button>
      </div>
    </div>

    <!-- ================= 2. FÜL: KIEJTÉS (MIKROFONOS) ================= -->
    <div id="tabContent1" class="tab-content hidden">
      <div class="h-36 bg-slate-700 rounded-xl flex flex-col items-center justify-center p-4 shadow-inner">
        <span class="text-xs text-purple-400 mb-1 uppercase tracking-wider">Mondd ki angolul:</span>
        <span id="voiceTargetHu" class="text-2xl font-bold text-center">...</span>
        <span id="voiceHint" class="text-xs text-slate-400 mt-2">Nyomd meg a mikrofont!</span>
      </div>
      <div id="voiceFeedback" class="h-8 mt-2 text-xs font-semibold flex items-center justify-center px-1 text-center"></div>
      <div class="flex justify-center items-center gap-4 mt-2">
        <button id="micBtn" class="bg-purple-600 hover:bg-purple-500 text-white p-4 rounded-full shadow-lg transition flex items-center justify-center scale-110">
          🎤
        </button>
        <button id="nextVoiceBtn" class="bg-slate-700 hover:bg-slate-600 px-5 py-2.5 rounded-xl text-xs font-medium transition">Következő ➔</button>
      </div>
    </div>

    <!-- ================= 3. FÜL: PÁROSÍTÓ JÁTÉK ================= -->
    <div id="tabContent2" class="tab-
